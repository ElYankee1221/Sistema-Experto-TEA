services:
  backend-experto:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tea_backend
    ports:
      - "8080:8000"
    volumes:
      #Replica el codigo de la carpeta /app del equipo al contenedor
      - .:/app
      #Replica el codigo de la carpeta /prolog del equipo al contendero
      - ./prolog:/app/prolog
    environment:
      #Crea una variable para indicar la ubicacion de swi-prolog dentro del contenedor
      - SWI_HOME_DIR=/usr/lib/swi-prolog
      #Crea una variable para indicar la ubicacion del modelo llm fuera del contenedor
      - LLM_BASE_URL=http://host.docker.internal:11434/v1
    restart: unless-stopped

